[project]
name = "modal-vault-server"
version = "0.1.0"
description = "Hosted vault + MCP memory plane: server-side Obsidian clone with a searchable projection agents reach over MCP"
requires-python = ">=3.11,<3.13"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "httpx2>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["server/tests"]